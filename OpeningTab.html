<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#191970">
  <title>Catch Me | Welcome</title>
  <style>
    :root {
      --navy: #191970;
      --navy-light: #25258a;
      --orange: #ff4500;
      --cream: #ffdead;
      --white: #fffaf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, var(--navy-light), var(--navy) 68%);
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(100%, 620px);
      text-align: center;
      padding: clamp(28px, 6vw, 56px) 24px;
      border: 1px solid rgba(255, 222, 173, .28);
      border-radius: 22px;
      background: rgba(7, 7, 48, .22);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .2);
    }
    .ball-preview {
      width: 112px;
      height: 112px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--orange);
      color: var(--cream);
      font-size: 20px;
      box-shadow: inset -8px -9px 0 rgba(120, 20, 0, .13), 0 10px 26px rgba(255, 69, 0, .25);
    }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); letter-spacing: .02em; }
    .subtitle { margin: 12px auto 0; max-width: 390px; line-height: 1.6; font-size: 1.08rem; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    button {
      min-width: 112px;
      padding: 12px 22px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--orange);
      color: var(--cream);
      font: bold 1rem Georgia, "Times New Roman", serif;
      cursor: pointer;
      box-shadow: 0 5px 0 #b83200;
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 7px 0 #b83200; }
    button:active { transform: translateY(2px); box-shadow: 0 3px 0 #b83200; }
    button.secondary { background: transparent; border-color: rgba(255, 222, 173, .55); box-shadow: none; }
    button.secondary:hover { background: rgba(255, 222, 173, .08); box-shadow: none; }
    button:focus-visible { outline: 3px solid var(--white); outline-offset: 4px; }
    .hint { margin-top: 26px; font-size: .9rem; opacity: .8; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="ball-preview" aria-hidden="true">Catch Me</div>
    <h1>Catch Me</h1>
    <p class="subtitle">One quick ball. One click. How fast can you catch it?</p>
    <div class="actions">
      <button id="playButton" type="button">Play</button>
      <button class="secondary" id="exitButton" type="button">Exit</button>
    </div>
    <p class="hint">Move your mouse carefully. The ball won't make it easy.</p>
  </main>
  <script>
    document.getElementById("playButton").addEventListener("click", () => {
      sessionStorage.setItem("catchMeStartTime", String(Date.now()));
      window.location.href = "GameTab.html";
    });
    document.getElementById("exitButton").addEventListener("click", () => {
      // Browsers generally allow scripts to close only tabs opened by a script.
      window.close();
      setTimeout(() => {
        if (!window.closed) alert("You can close this browser tab to exit the game.");
      }, 50);
    });
  </script>
</body>
</html>
